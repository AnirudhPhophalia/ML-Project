<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="Explore a rule-based estimate of heavy equipment auction prices.">
<title>Heavy Equipment Price Estimator</title>
<style>
:root{color-scheme:light;--paper:#faf4e9;--card:#fffaf1;--ink:#312119;--muted:#6b5345;--rust:#a23a21;--rust-deep:#7b2918;--line:#dfccba;--soft:#f5e5d4;--focus:#a23a21;font-family:"Inter",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink)}
button,input,select{font:inherit}
button,select{cursor:pointer}
a{color:var(--rust-deep);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.shell{width:min(1100px,calc(100% - 64px));margin:auto}
header{border-bottom:1px solid var(--line)}
.top{height:66px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:.82rem}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;letter-spacing:.02em}
.mark{display:grid;place-items:center;width:27px;height:27px;border-radius:6px;background:var(--rust);color:#fffaf2;font-size:.8rem}
.tag{color:var(--muted)}
.hero{padding:48px 0 32px}
.kicker{margin:0 0 12px;color:var(--rust-deep);font-size:.72rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
h1,h2,p{margin-top:0}
h1{font-family:"DM Serif Text",Georgia,serif;font-weight:500;font-size:clamp(2.45rem,6vw,4.25rem);line-height:1.03;letter-spacing:-.048em;margin-bottom:14px}
.hero p:last-child{margin-bottom:0;color:var(--muted);line-height:1.55}
.layout{display:grid;grid-template-columns:minmax(0,350px) minmax(0,1fr);gap:18px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden}
.form-card{padding:24px}
.form-title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:20px}
h2{font-size:1.16rem;letter-spacing:-.025em;margin-bottom:0}
.reset{background:transparent;color:var(--rust-deep);padding:0;border:0;text-decoration:underline;text-underline-offset:3px;font-size:.83rem}
.fields{display:grid;gap:15px}
label{display:block;font-size:.82rem;font-weight:720;margin-bottom:6px}
.optional{font-weight:450;color:var(--muted)}
input,select{width:100%;min-width:0;height:42px;border-radius:7px;border:1px solid #d4bca8;padding:0 10px;background:#fffdf7;color:var(--ink)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.hint{margin:6px 0 0;color:var(--muted);font-size:.74rem;line-height:1.45}
.primary{border:0;border-radius:8px;width:100%;height:46px;background:var(--rust);color:#fffaf1;font-size:.9rem;font-weight:750;margin-top:19px}
.primary:hover{background:var(--rust-deep)}
.estimate{padding:22px 26px 19px;background:var(--soft);border-bottom:1px solid var(--line)}
.estimate-label{color:var(--rust-deep);font-weight:760;font-size:.8rem;margin-bottom:3px}
.amount{font-family:"DM Serif Text",Georgia,serif;color:var(--ink);font-size:clamp(2.85rem,6vw,4.35rem);font-variant-numeric:lining-nums tabular-nums;line-height:1;letter-spacing:-.055em;display:block}
.summary{margin:9px 0 0;font-size:.82rem;color:var(--muted);line-height:1.4}
.chart-area{margin:0;padding:21px 22px 18px}
.chart-header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 4px 7px}
.legend{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;display:inline-block;border-radius:50%;background:var(--rust)}
canvas{display:block;width:100%;height:234px}
figcaption{margin:7px 4px 0;font-size:.76rem;color:var(--muted);line-height:1.45}
footer{margin:22px 0 28px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:12px;color:var(--muted);font-size:.77rem;line-height:1.55}
footer p{margin:0;max-width:68ch}
footer a{white-space:nowrap}
@media(max-width:780px){.layout{grid-template-columns:1fr}.shell{width:min(600px,calc(100% - 36px))}.hero{padding:30px 0 25px}.top{height:55px}}
@media(max-width:440px){.form-card,.estimate{padding:18px}.chart-area{padding:17px 11px}.chart-header{align-items:flex-start}.legend{white-space:normal;font-size:.67rem}.chart-header h2{font-size:1rem}canvas{height:211px}footer{flex-direction:column}}
</style>
</head>
<body>
<header>
  <div class="shell top">
    <span class="brand"><span class="mark" aria-hidden="true">A</span> Auction Estimator</span>
    <span class="tag">Heavy equipment</span>
  </div>
</header>
<main class="shell">
  <section class="hero">
    <p class="kicker">Equipment valuation</p>
    <h1>Heavy Equipment Price Estimator</h1>
    <p>Enter the sale details to estimate an auction price and see how it varies with equipment age.</p>
  </section>

  <div class="layout">
    <section class="card form-card" aria-labelledby="details-title">
      <div class="form-title">
        <h2 id="details-title">Equipment details</h2>
        <button class="reset" type="reset" form="estimator">Reset</button>
      </div>
      <form id="estimator">
        <div class="fields">
          <div>
            <label for="machine">Base class</label>
            <select id="machine" name="machine">
              <option value="140">140 · Motor grader</option>
              <option value="320" selected>320 · Excavator</option>
              <option value="D6">D6 · Dozer</option>
              <option value="12">12 · Motor grader</option>
            </select>
          </div>
          <div class="field-row">
            <div>
              <label for="manufacture">Manufacture year</label>
              <input id="manufacture" name="manufacture" type="number" inputmode="numeric" min="1951" max="2010" step="1" value="2003" required>
            </div>
            <div>
              <label for="sale">Auction year</label>
              <input id="sale" name="sale" type="number" inputmode="numeric" min="1951" step="1" value="2010" required>
            </div>
          </div>
          <div>
            <label for="hours">Meter hours <span class="optional">(optional)</span></label>
            <input id="hours" name="hours" type="number" inputmode="numeric" min="0" step="1" value="4500" placeholder="Unknown" aria-describedby="hours-note">
            <p class="hint" id="hours-note">Leave blank if the meter reading is unknown.</p>
          </div>
          <div>
            <label for="region">Regional price tier</label>
            <select id="region" name="region">
              <option value="value">Value</option>
              <option value="standard" selected>Standard</option>
              <option value="premium">Premium</option>
            </select>
          </div>
        </div>
        <button class="primary" type="submit">Estimate price</button>
      </form>
    </section>
    <section class="card" aria-labelledby="estimate-label">
      <div class="estimate">
        <p class="estimate-label" id="estimate-label">Estimated auction price</p>
        <div aria-live="polite" aria-atomic="true">
          <output id="amount" class="amount" form="estimator" for="machine manufacture sale hours region">—</output>
          <p class="summary" id="summary"></p>
        </div>
      </div>
      <figure class="chart-area">
        <div class="chart-header">
          <h2>Estimated price by age</h2>
          <span class="legend"><span class="dot" aria-hidden="true"></span>Selected age</span>
        </div>
        <canvas id="curve" role="img" aria-describedby="chart-note">Line graph of estimated price by equipment age.</canvas>
        <figcaption id="chart-note">The curve varies equipment age while keeping the base class, meter hours and region fixed.</figcaption>
      </figure>
    </section>
  </div>

  <footer>
    <a href="https://github.com/pranavt1wari/Kaggle-Heavy-Equipment-Price-Prediction-Challenge/blob/main/FinalNotebook-Version12.ipynb">Notebook 12 ↗</a>
  </footer>
  <noscript>Enable JavaScript to calculate estimates and draw the age curve.</noscript>
</main>
<script>
"use strict";

// Observed training medians from notebook 12, cell [19], assigned representative ages.
// Beyond the last anchor the demo keeps the last observed bracket's base price.
const AGE_ANCHORS = [3, 9, 19, 35];
const CLASS_PRICES = {
  "140": [112500, 84000, 55000, 43000],
  "320": [77500, 51000, 32500, 49250],
  "D6": [92000, 60000, 42000, 22000],
  "12": [110000, 76000, 42000, 15500]
};
// Demo assumptions, fixed here for reproducible estimates.
const REGION_FACTORS = { value: 0.92, standard: 1, premium: 1.10 };

function agePrice(machine, age) {
  const prices = CLASS_PRICES[machine];
  if (age <= AGE_ANCHORS[0]) return prices[0];
  for (let i = 1; i < AGE_ANCHORS.length; i++) {
    if (age <= AGE_ANCHORS[i]) {
      const progress = (age - AGE_ANCHORS[i - 1]) / (AGE_ANCHORS[i] - AGE_ANCHORS[i - 1]);
      return prices[i - 1] + progress * (prices[i] - prices[i - 1]);
    }
  }
  return prices[prices.length - 1];
}

function estimate(machine, age, hours, region) {
  const cappedHours = Math.min(hours ?? 0, 30000);
  const annualHours = cappedHours / (age + 1);
  const usageFactor = hours === null ? 1 : Math.max(0.78, Math.min(1.05, 1 + (650 - annualHours) / 10000));
  return Math.round(agePrice(machine, age) * usageFactor * REGION_FACTORS[region] / 100) * 100;
}

const form = document.querySelector("#estimator");
const manufacture = document.querySelector("#manufacture");
const sale = document.querySelector("#sale");
const canvas = document.querySelector("#curve");
const dollars = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
const integer = new Intl.NumberFormat("en-US");
let plotted;

const currentYear = new Date().getFullYear();
sale.max = currentYear;

function drawChart() {
  if (!plotted) return;
  const ctx = canvas.getContext("2d");
  if (!ctx) return;
  const { machine, age, hours, region, price } = plotted;
  const bounds = canvas.getBoundingClientRect();
  const w = bounds.width;
  const h = bounds.height;
  if (w < 100 || h < 100) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const left = 48, right = w - 14, top = 15, bottom = h - 40;
  const maxAge = Math.max(40, Math.ceil(age / 10) * 10);
  const samples = Array.from({ length: maxAge * 2 + 1 }, (_, i) => estimate(machine, i / 2, hours, region));
  const maxPrice = Math.ceil(Math.max(...samples) * 1.10 / 20000) * 20000;
  const x = years => left + years / maxAge * (right - left);
  const y = value => bottom - value / maxPrice * (bottom - top);

  ctx.font = "11px system-ui, sans-serif";
  ctx.fillStyle = "#6b5345";
  ctx.strokeStyle = "#e4d4c2";
  ctx.lineWidth = 1;
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";
  for (let i = 0; i <= 4; i++) {
    const value = i * maxPrice / 4;
    const py = y(value);
    ctx.beginPath();
    ctx.moveTo(left, py);
    ctx.lineTo(right, py);
    ctx.stroke();
    ctx.fillText(value === 0 ? "$0" : "$" + value / 1000 + "k", left - 8, py);
  }
  ctx.textAlign = "center";
  const tick = maxAge >= 60 ? 20 : 10;
  for (let years = 0; years <= maxAge; years += tick) {
    ctx.fillText(years, x(years), bottom + 15);
  }
  ctx.fillText("Equipment age (years)", (left + right) / 2, h - 6);

  function traceCurve() {
    ctx.beginPath();
    samples.forEach((p, i) => {
      if (i === 0) ctx.moveTo(x(0), y(p));
      else ctx.lineTo(x(i / 2), y(p));
    });
  }

  traceCurve();
  ctx.lineTo(right, bottom);
  ctx.lineTo(left, bottom);
  ctx.closePath();
  const fill = ctx.createLinearGradient(0, top, 0, bottom);
  fill.addColorStop(0, "#eac0a7");
  fill.addColorStop(1, "#fcf1e5");
  ctx.fillStyle = fill;
  ctx.fill();
  traceCurve();
  ctx.strokeStyle = "#a23a21";
  ctx.lineWidth = 2.5;
  ctx.lineJoin = "round";
  ctx.stroke();

  const px = x(age), py = y(price);
  ctx.save();
  ctx.setLineDash([4, 4]);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(px, bottom);
  ctx.stroke();
  ctx.restore();
  ctx.beginPath();
  ctx.arc(px, py, 5, 0, Math.PI * 2);
  ctx.fillStyle = "#a23a21";
  ctx.fill();
  ctx.strokeStyle = "#fffaf1";
  ctx.lineWidth = 2;
  ctx.stroke();
}

function update() {
  const values = new FormData(form);
  const machine = values.get("machine");
  const age = Number(values.get("sale")) - Number(values.get("manufacture"));
  const hours = values.get("hours") === "" ? null : Number(values.get("hours"));
  const region = values.get("region");
  const price = estimate(machine, age, hours, region);
  plotted = { machine, age, hours, region, price };
  document.querySelector("#amount").value = dollars.format(price);
  const machineLabel = form.elements.machine.selectedOptions[0].textContent;
  const hoursLabel = hours === null ? "Hours unknown" : integer.format(hours) + " hours";
  document.querySelector("#summary").textContent = machineLabel + " · " + age + (age === 1 ? " year old" : " years old") + " · " + hoursLabel;
  canvas.setAttribute("aria-label", "Estimated price by age for class " + machine + ". At age " + age + ", " + dollars.format(price) + ".");
  drawChart();
}

sale.addEventListener("input", () => {
  manufacture.max = sale.value || currentYear;
});

form.addEventListener("submit", event => {
  event.preventDefault();
  update();
});
form.addEventListener("reset", () => requestAnimationFrame(() => {
  manufacture.max = sale.value;
  update();
}));
new ResizeObserver(drawChart).observe(canvas);
update();
</script>
</body>
</html>
